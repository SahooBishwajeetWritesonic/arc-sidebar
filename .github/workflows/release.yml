name: Release

# Pushing a version tag (v1.0.0) checks the code, builds the extension and attaches its zip
# to a GitHub release of that version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json's version $version." >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" ".output/arc-sidebar-${GITHUB_REF_NAME#v}-chrome.zip"
          --title "Arc Sidebar $GITHUB_REF_NAME"
          --generate-notes
